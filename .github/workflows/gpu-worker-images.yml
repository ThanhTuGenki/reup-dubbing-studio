name: GPU Worker images

on:
  pull_request:
    paths:
      - ".github/workflows/gpu-worker-images.yml"
      - "contracts/openapi/worker.openapi.yaml"
      - "workers/gpu/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpu-worker-images.yml"
      - "contracts/openapi/worker.openapi.yaml"
      - "workers/gpu/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: gpu-worker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: make -C workers/gpu check
      - run: make -C workers/gpu contract-check

  image:
    needs: worker-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: batch
            repository: gpu-worker-batch
          - target: interactive-tts
            repository: gpu-worker-interactive-tts
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: workers/gpu/containers/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.repository }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=0.1.0
            CONTRACT_VERSION=1
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke test image without model inference
        run: docker run --rm --entrypoint python local/${{ matrix.repository }}:${{ github.sha }} -m reup_worker.image_smoke ${{ matrix.target }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/${{ matrix.repository }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.repository }}.spdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.repository }}:${{ github.sha }}
          format: sarif
          output: ${{ matrix.repository }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Block fixed critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.repository }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ matrix.repository }}.sarif
      - name: Push immutable image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/gpu/containers/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:0.1.0
            ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=0.1.0
            CONTRACT_VERSION=1
          cache-from: type=gha,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
      - name: Record immutable digest
        if: github.event_name != 'pull_request'
        run: |
          test -n '${{ steps.push.outputs.digest }}'
          printf '%s@%s\n' 'ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}' '${{ steps.push.outputs.digest }}' > ${{ matrix.repository }}.digest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.repository }}-supply-chain
          path: |
            ${{ matrix.repository }}.spdx.json
            ${{ matrix.repository }}.sarif
            ${{ matrix.repository }}.digest.txt
          if-no-files-found: ignore
