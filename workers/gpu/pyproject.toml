[project]
name = "reup-dubbing-gpu-worker"
version = "0.1.0"
description = "GPU Worker Agent for Reup Dubbing Studio"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "pydantic-settings>=2.11,<3",
  "structlog>=25.4,<26",
]

[project.scripts]
reup-gpu-worker = "reup_worker.main:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "openapi-python-client>=0.27,<0.28",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "respx>=0.22,<0.23",
  "ruff>=0.13,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reup_worker", "src/reup_worker_contract"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
exclude = ["src/reup_worker_contract"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reup_worker"]

[tool.uv]
default-groups = ["dev"]
