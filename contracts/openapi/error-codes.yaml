openapi: 3.1.0
info:
  title: Reup Dubbing Studio Control Plane Error Catalog
  version: 0.1.0
  description: >-
    Catalogue mã lỗi nền tảng được sử dụng bởi API-FOUNDATION-001. Catalogue
    không mô tả endpoint, worker API hoặc business API.
paths: {}
components:
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - ROUTE_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorCodeCatalog:
      type: object
      additionalProperties: false
      required:
        - VALIDATION_ERROR
        - ROUTE_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
      properties:
        VALIDATION_ERROR:
          $ref: '#/components/schemas/ErrorDefinition'
        ROUTE_NOT_FOUND:
          $ref: '#/components/schemas/ErrorDefinition'
        RATE_LIMITED:
          $ref: '#/components/schemas/ErrorDefinition'
        INTERNAL_ERROR:
          $ref: '#/components/schemas/ErrorDefinition'
    ErrorDefinition:
      type: object
      additionalProperties: false
      required:
        - httpStatus
        - description
      properties:
        httpStatus:
          type: integer
          minimum: 400
          maximum: 599
        description:
          type: string
      examples:
        - httpStatus: 400
          description: Request không đạt validation tại HTTP boundary.
        - httpStatus: 404
          description: Không có route phù hợp với request.
        - httpStatus: 429
          description: Client vượt giới hạn request của API instance.
        - httpStatus: 500
          description: Lỗi nội bộ không được tiết lộ chi tiết cho client.
