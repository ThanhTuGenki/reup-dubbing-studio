openapi: 3.1.0
info:
  title: Reup Dubbing Studio Control Plane Error Catalog
  version: 0.1.0
  description: >-
    Catalogue mã lỗi nền tảng được sử dụng bởi API-FOUNDATION-001. Catalogue
    không mô tả endpoint, worker API hoặc business API.
paths: {}
components:
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - ROUTE_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SETTINGS_NOT_CONFIGURED
        - SETTINGS_VALIDATION_FAILED
        - CONNECTION_TEST_FAILED
        - VERSION_CONFLICT
    ErrorCodeCatalog:
      type: object
      additionalProperties: false
      required:
        - VALIDATION_ERROR
        - ROUTE_NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SETTINGS_NOT_CONFIGURED
        - SETTINGS_VALIDATION_FAILED
        - CONNECTION_TEST_FAILED
        - VERSION_CONFLICT
      properties:
        VALIDATION_ERROR:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus:
              type: integer
              const: 400
            description:
              type: string
              const: Request không đạt validation tại HTTP boundary.
        ROUTE_NOT_FOUND:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus:
              type: integer
              const: 404
            description:
              type: string
              const: Không có route phù hợp với request.
        RATE_LIMITED:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus:
              type: integer
              const: 429
            description:
              type: string
              const: Client vượt giới hạn request của API instance.
        INTERNAL_ERROR:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus:
              type: integer
              const: 500
            description:
              type: string
              const: Lỗi nội bộ không được tiết lộ chi tiết cho client.
        SETTINGS_NOT_CONFIGURED:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus: { type: integer, const: 409 }
            description: { type: string, const: Credential được yêu cầu chưa được cấu hình. }
        SETTINGS_VALIDATION_FAILED:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus: { type: integer, const: 422 }
            description: { type: string, const: Cấu hình vi phạm rule của aggregate Settings. }
        CONNECTION_TEST_FAILED:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus: { type: integer, const: 502 }
            description: { type: string, const: Không thể xác minh kết nối provider bằng cấu hình đã cấp. }
        VERSION_CONFLICT:
          type: object
          additionalProperties: false
          required: [httpStatus, description]
          properties:
            httpStatus: { type: integer, const: 409 }
            description: { type: string, const: ETag không còn khớp version hiện tại. }
