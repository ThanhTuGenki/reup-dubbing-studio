        meta: { $ref: '#/components/schemas/SuccessMeta' }
    PreviewGrantEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PreviewGrant' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    CommittedAssetEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CommittedAsset' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    ProfileVersionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ProfileVersion' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    VoiceProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/VoiceProfile' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    VoiceProfileListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/VoiceProfilePage' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    CommittedVoiceSampleEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CommittedVoiceSample' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    RequestId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    SuccessMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/HealthStatus'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    CredentialState:
      type: object
      additionalProperties: false
      required: [configured, hint, rotatedAt]
      properties:
        configured: { type: boolean }
        hint: { type: [string, 'null'], maxLength: 4 }
        rotatedAt: { type: [string, 'null'], format: date-time }
    Settings:
      type: object
      additionalProperties: false
      required: [version, contentAgent, storage, retention]
      properties:
        version: { type: integer, minimum: 1 }
        contentAgent:
          type: object
          additionalProperties: false
          required: [provider, model, credential]
          properties:
            provider: { type: string, enum: [ANTHROPIC, OPENAI] }
            model: { type: string, maxLength: 128 }
            credential: { $ref: '#/components/schemas/CredentialState' }
        storage:
          type: object
          additionalProperties: false
          required: [backend, accountId, bucket, credential]
          properties:
            backend: { type: string, const: R2 }
            accountId: { type: string, maxLength: 64 }
            bucket: { type: string, maxLength: 63 }
            credential: { $ref: '#/components/schemas/CredentialState' }
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
    SettingsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Settings' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [rawVideoDays, intermediateDays, taskLogDays, finalOutputDays]
      properties:
        rawVideoDays: { type: integer, minimum: 1, maximum: 365 }
        intermediateDays: { type: integer, minimum: 1, maximum: 90 }
        taskLogDays: { type: integer, minimum: 1, maximum: 365 }
        finalOutputDays: { type: integer, minimum: 1, maximum: 3650 }
    ContentSecretCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, value]
          properties:
            action: { type: string, const: REPLACE }
            value: { type: string, minLength: 1, maxLength: 4096 }
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { type: string, const: CLEAR }
    StorageSecretValue:
      type: object
      additionalProperties: false
      required: [accessKeyId, secretAccessKey]
      properties:
        accessKeyId: { type: string, minLength: 1, maxLength: 256 }
        secretAccessKey: { type: string, minLength: 1, maxLength: 4096 }
    StorageSecretCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, value]
          properties:
            action: { type: string, const: REPLACE }
            value: { $ref: '#/components/schemas/StorageSecretValue' }
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action: { type: string, const: CLEAR }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        contentAgent:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            provider: { type: string, enum: [ANTHROPIC, OPENAI] }
            model: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:/-]+$' }
            credential: { $ref: '#/components/schemas/ContentSecretCommand' }
        storage:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            backend: { type: string, const: R2 }
            accountId: { type: string, pattern: '^[a-fA-F0-9]{32}$' }
            bucket: { type: string, minLength: 3, maxLength: 63 }
            credential: { $ref: '#/components/schemas/StorageSecretCommand' }
        retention:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            rawVideoDays: { type: integer, minimum: 1, maximum: 365 }
            intermediateDays: { type: integer, minimum: 1, maximum: 90 }
            taskLogDays: { type: integer, minimum: 1, maximum: 365 }
            finalOutputDays: { type: integer, minimum: 1, maximum: 3650 }
    TestCredential:
      oneOf:
        - type: object
          additionalProperties: false
          required: [source]
          properties:
            source: { type: string, const: STORED }
        - type: object
          additionalProperties: false
          required: [source, value]
          properties:
            source: { type: string, const: PROVIDED }
            value: { type: string, minLength: 1, maxLength: 4096 }
    StorageTestCredential:
      oneOf:
        - type: object
          additionalProperties: false
          required: [source]
          properties:
            source: { type: string, const: STORED }
        - type: object
          additionalProperties: false
          required: [source, value]
          properties:
            source: { type: string, const: PROVIDED }
            value: { $ref: '#/components/schemas/StorageSecretValue' }
    ContentAgentTestRequest:
      type: object
      additionalProperties: false
      required: [provider, model, credential]
      properties:
        provider: { type: string, enum: [ANTHROPIC, OPENAI] }
        model: { type: string, minLength: 1, maxLength: 128 }
        credential: { $ref: '#/components/schemas/TestCredential' }
    StorageTestRequest:
      type: object
      additionalProperties: false
      required: [accountId, bucket, credential]
      properties:
        accountId: { type: string, pattern: '^[a-fA-F0-9]{32}$' }
        bucket: { type: string, minLength: 3, maxLength: 63 }
        credential: { $ref: '#/components/schemas/StorageTestCredential' }
    ConnectionTestResult:
      type: object
      additionalProperties: false
      required: [status, latencyMs, checkedAt, message]
      properties:
        status: { type: string, const: CONNECTED }
        latencyMs: { type: integer, minimum: 0 }
        checkedAt: { type: string, format: date-time }
        message: { type: string }
    ConnectionTestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ConnectionTestResult' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    IngestSelection:
      type: object
      additionalProperties: false
      required: [sourceAccountId, sourceContentIds, channelProfileId]
      properties:
        sourceAccountId: { $ref: '#/components/schemas/UuidV7' }
        sourceContentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/UuidV7' }
        channelProfileId: { $ref: '#/components/schemas/UuidV7' }
        seriesProfileId:
          oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }]
    IngestDisposition:
      type: string
      enum: [READY, READY_RETRY, ALREADY_QUEUED, ALREADY_INGESTED, SOURCE_NOT_FOUND, SOURCE_UNAVAILABLE, SOURCE_NOT_INGEST_ELIGIBLE, SOURCE_ACCOUNT_UNAVAILABLE, SOURCE_CREDENTIAL_REQUIRED, PROFILE_NOT_READY, SERIES_NOT_READY, SERIES_CHANNEL_MISMATCH, VIDEO_PROFILE_CONFLICT]
    IngestPreflightItem:
      type: object
      additionalProperties: false
      required: [sourceContentId, disposition, existingVideoId, existingJobId, issues]
      properties:
        sourceContentId: { $ref: '#/components/schemas/UuidV7' }
        disposition: { $ref: '#/components/schemas/IngestDisposition' }
        existingVideoId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        existingJobId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        issues: { type: array, items: { type: string } }
    IngestPreflight:
      type: object
      additionalProperties: false
      required: [summary, items]
      properties:
        summary:
          type: object
          additionalProperties: false
          required: [total, ready, blocked]
          properties:
            total: { type: integer, minimum: 1 }
            ready: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: '#/components/schemas/IngestPreflightItem' } }
    IngestCreateItem:
      type: object
      additionalProperties: false
      required: [sourceContentId, result, videoId, jobId, taskId, jobStatus, videoStatus, issues]
      properties:
        sourceContentId: { $ref: '#/components/schemas/UuidV7' }
        result: { type: string, enum: [CREATED, ALREADY_QUEUED, ALREADY_INGESTED, SKIPPED_INVALID] }
        videoId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        jobId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        taskId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        jobStatus: { type: [string, 'null'], enum: [QUEUED, null] }
        videoStatus: { type: [string, 'null'] }
        issues: { type: array, items: { type: string } }
    IngestCreateResult:
      type: object
      additionalProperties: false
      required: [summary, items]
      properties:
        summary:
          type: object
          additionalProperties: false
          required: [total, created, reused, skipped]
          properties:
            total: { type: integer, minimum: 1 }
            created: { type: integer, minimum: 0 }
            reused: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: '#/components/schemas/IngestCreateItem' } }
    IngestPreflightEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/IngestPreflight' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    IngestCreateEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/IngestCreateResult' }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    QueueJobStatus: { type: string, enum: [QUEUED, RUNNING, WAITING_FOR_GPU, WAITING_FOR_REVIEW, SUCCEEDED, FAILED, CANCELLED] }
    QueueTask:
      type: object
      additionalProperties: false
      required: [id, taskType, resourceClass, status, progressPercent, progressDetail, attemptCount, maxAttempts, readyAt, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        taskType: { type: string }
        resourceClass: { type: string }
        status: { type: string, enum: [BLOCKED, READY, LEASED, RUNNING, WAITING, SUCCEEDED, FAILED, CANCELLED] }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        progressDetail: { type: [string, 'null'] }
        attemptCount: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        readyAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QueueJob:
      type: object
      required: [id, videoId, kind, status, version, title, channelProfileId, channelProfileName, seriesProfileId, seriesProfileName, currentTask, progress, failure, actions, startedAt, finishedAt, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        videoId: { $ref: '#/components/schemas/UuidV7' }
        kind: { type: string, enum: [INGEST, FULL_PIPELINE, RERENDER, REGENERATE_CONTENT] }
        status: { $ref: '#/components/schemas/QueueJobStatus' }
        version: { type: integer, minimum: 1 }
        title: { type: [string, 'null'] }
        channelProfileId: { $ref: '#/components/schemas/UuidV7' }
        channelProfileName: { type: [string, 'null'] }
        seriesProfileId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        seriesProfileName: { type: [string, 'null'] }
        currentTask: { oneOf: [{ $ref: '#/components/schemas/QueueTask' }, { type: 'null' }] }
        progress:
          type: object
          additionalProperties: false
          required: [percent, completedTasks, totalTasks]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100 }
            completedTasks: { type: integer, minimum: 0 }
            totalTasks: { type: integer, minimum: 0 }
        failure:
          oneOf:
            - type: object
              additionalProperties: false
              required: [code, detail]
              properties: { code: { type: string }, detail: { type: [string, 'null'] } }
            - { type: 'null' }
        actions:
          type: object
          additionalProperties: false
          required: [canRetry, canCancel]
          properties: { canRetry: { type: boolean }, canCancel: { type: boolean } }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    QueueTimelineEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, fromStatus, toStatus, message, occurredAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        eventType: { type: string }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    QueueJobDetail:
      allOf:
        - { $ref: '#/components/schemas/QueueJob' }
        - type: object
          required: [tasks, timeline]
          properties:
            tasks: { type: array, items: { $ref: '#/components/schemas/QueueTask' } }
            timeline: { type: array, items: { $ref: '#/components/schemas/QueueTimelineEvent' } }
    QueueAction:
      type: object
      additionalProperties: false
      properties:
        taskId: { $ref: '#/components/schemas/UuidV7' }
        reason: { type: string, maxLength: 500 }
    QueueAttempt:
      type: object
      additionalProperties: false
      required: [id, taskId, taskType, attemptNumber, executorKind, status, startedAt, finishedAt, executionMs, errorCode, errorDetail]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        taskId: { $ref: '#/components/schemas/UuidV7' }
        taskType: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        executorKind: { type: string, enum: [CONTROL_PLANE, WORKER] }
        status: { type: string, enum: [STARTED, SUCCEEDED, FAILED, TIMED_OUT, CANCELLED] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        executionMs: { type: [string, 'null'], pattern: '^[0-9]+$' }
        errorCode: { type: [string, 'null'] }
        errorDetail: { type: [string, 'null'] }
    QueueJobListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/QueueJob' } }
            nextCursor: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    QueueJobDetailEnvelope:
      type: object
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/QueueJobDetail' }, meta: { $ref: '#/components/schemas/SuccessMeta' } }
    QueueAttemptListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, nextCursor]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/QueueAttempt' } }
            nextCursor: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/SuccessMeta' }
    ProblemDetails:
      type: object
      description: RFC 9457 với extension code và requestId.
      required:
        - type
        - title
        - status
        - instance
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - ROUTE_NOT_FOUND
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SETTINGS_NOT_CONFIGURED
            - SETTINGS_VALIDATION_FAILED
            - CONNECTION_TEST_FAILED
            - VERSION_CONFLICT
            - PROFILE_NAME_CONFLICT
            - PROFILE_NOT_FOUND
            - PROFILE_ARCHIVED
            - PROFILE_NOT_READY
            - PROFILE_HAS_ACTIVE_SERIES
            - PROFILE_PARENT_ARCHIVED
            - PROFILE_VERSION_CONFLICT
            - PROFILE_ASSET_NOT_AVAILABLE
            - PROFILE_ASSET_ROLE_INVALID
            - PROFILE_MASK_INVALID
            - PROFILE_VOICE_NOT_READY
            - PROFILE_VALIDATION_FAILED
            - VOICE_NOT_FOUND
            - VOICE_NAME_CONFLICT
            - VOICE_VERSION_CONFLICT
            - VOICE_VALIDATION_FAILED
            - VOICE_NOT_READY
            - VOICE_ARCHIVED
            - VOICE_IN_USE
            - VOICE_SAMPLE_NOT_AVAILABLE
            - SOURCE_ACCOUNT_NOT_FOUND
            - SOURCE_ACCOUNT_VERSION_CONFLICT
            - SOURCE_ACCOUNT_CREDENTIAL_REQUIRED
            - DISCOVERY_RUN_NOT_FOUND
            - DISCOVERY_MODE_DISABLED
            - DISCOVERY_RUN_CONFLICT
            - WATCHLIST_NOT_FOUND
            - WATCHLIST_VERSION_CONFLICT
            - WATCHLIST_DUPLICATE
            - WATCHLIST_RUN_ACTIVE
            - DISCOVERY_VALIDATION_FAILED
            - DISCOVERY_CURSOR_INVALID
            - DISCOVERY_PROVIDER_UNAVAILABLE
            - INGEST_VALIDATION_FAILED
            - INGEST_NO_CREATABLE_ITEMS
            - QUEUE_VALIDATION_FAILED
            - QUEUE_JOB_NOT_FOUND
            - QUEUE_CURSOR_INVALID
            - JOB_NOT_CANCELLABLE
            - JOB_NOT_RETRYABLE
            - JOB_RETRY_CONFLICT
            - IDEMPOTENCY_KEY_REUSED
        requestId:
          $ref: '#/components/schemas/RequestId'
  responses:
    Problem:
      description: Lỗi HTTP chuẩn RFC 9457; không dùng success envelope.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
