      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong effective ETag gồm version Series và parent Channel.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    VoiceIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProfileQuery:
      name: query
      in: query
      schema: { type: string, maxLength: 120 }
    ProfileStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ProfileStatus' }
    ProfileReadinessFilter:
      name: readiness
      in: query
      schema: { $ref: '#/components/schemas/ProfileReadiness' }
    ChannelProfileFilter:
      name: channelProfileId
      in: query
      schema: { $ref: '#/components/schemas/UuidV7' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag nhận từ lần đọc Settings gần nhất.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: UUID v7 do API sinh cho request hiện tại.
      schema:
        $ref: '#/components/schemas/RequestId'
    SettingsEtag:
      description: Strong ETag biểu diễn version hiện tại.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ChannelProfileEtag:
      description: Strong ETag của Channel Profile.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesProfileEtag:
      description: Strong ETag của effective Series, gồm version Series và parent.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    VoiceProfileEtag:
      description: Strong ETag của Voice Profile và current sample set.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    ProfileStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    ProfileReadiness:
      type: string
      enum: [READY, NEEDS_CONFIGURATION]
    ProfileReadinessIssue:
      type: string
      enum:
        - DEFAULT_VOICE_REQUIRED
        - DEFAULT_VOICE_NOT_READY
        - OUTPUT_REQUIRED
        - MASK_REQUIRED
        - MASK_REFERENCE_ASSET_REQUIRED
        - CAST_REQUIRED
        - CAST_VOICE_NOT_READY
        - PARENT_CHANNEL_NOT_ACTIVE
    VoiceProfileStatus:
      type: string
      enum: [DRAFT, READY, BLOCKED_LICENSE, ARCHIVED]
    VoiceLicenseKind:
      type: string
      enum: [OWNED_RECORDING, AUTHORIZED_COMMERCIAL, CC_BY, CC_BY_NC, CUSTOM, UNKNOWN]
    VoiceReadinessIssue:
      type: string
      enum:
        - VOICE_PRIMARY_SAMPLE_REQUIRED
        - VOICE_SAMPLE_TRANSCRIPT_REQUIRED
        - VOICE_SAMPLE_DURATION_INVALID
        - VOICE_LICENSE_REFERENCE_REQUIRED
        - VOICE_COMMERCIAL_USE_NOT_ALLOWED
        - VOICE_SAMPLE_NOT_AVAILABLE
