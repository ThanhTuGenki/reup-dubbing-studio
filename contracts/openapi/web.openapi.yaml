      type: string
      enum: [SINGLE, DUAL, MULTI_AUTO]
    TimingPolicy:
      type: string
      enum: [PRESERVE_SEGMENT, FIT_SEGMENT, ALLOW_DRIFT]
    PipelineConfig:
      type: object
      additionalProperties: false
      required: [targetLanguage, defaultVoiceProfileId, voiceMode, subtitleLanguage, subtitleFilenameRule, subtitleMaxLineLength, ttsSpeed, timingPolicy, output16x9Enabled, output9x16Enabled]
      properties:
        targetLanguage: { type: string, maxLength: 35 }
        defaultVoiceProfileId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        voiceMode: { $ref: '#/components/schemas/VoiceMode' }
        subtitleLanguage: { type: string, maxLength: 35 }
        subtitleFilenameRule: { type: string, maxLength: 200 }
        subtitleMaxLineLength: { type: [integer, 'null'], minimum: 1, maximum: 500 }
        ttsSpeed: { type: number, minimum: 0.5, maximum: 2 }
        timingPolicy: { $ref: '#/components/schemas/TimingPolicy' }
        output16x9Enabled: { type: boolean }
        output9x16Enabled: { type: boolean }
    PipelinePatch:
      type: object
