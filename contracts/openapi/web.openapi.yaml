      summary: Xin preview audio của segment
      operationId: previewStudioSegment
      parameters: [{ $ref: '#/components/parameters/VideoId' }, { name: segmentId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }]
      responses:
        '200': { description: Preview metadata, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAssetEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /videos/{videoId}/segments/{segmentId}/regenerate:
    post:
      summary: Tạo request regenerate segment
      operationId: regenerateStudioSegment
      parameters: [{ $ref: '#/components/parameters/VideoId' }, { name: segmentId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Regenerate queued, content: { application/json: { schema: { $ref: '#/components/schemas/StudioMutationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /videos/{videoId}/review-decisions:
    post:
      summary: Lưu review decision
      operationId: createStudioReviewDecision
      parameters: [{ $ref: '#/components/parameters/VideoId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudioReviewRequest' } } } }
      responses:
        '200': { description: Review decision, content: { application/json: { schema: { $ref: '#/components/schemas/StudioMutationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /videos/{videoId}/render-requests:
    post:
      summary: Yêu cầu render output
      operationId: requestStudioRender
      parameters: [{ $ref: '#/components/parameters/VideoId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Render queued, content: { application/json: { schema: { $ref: '#/components/schemas/StudioMutationEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /publication-tasks:
    get:
      summary: Liệt kê task đăng thủ công
      operationId: listPublicationTasks
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PublicationTaskStatus' } }
        - { name: platform, in: query, schema: { $ref: '#/components/schemas/PublishingPlatform' } }
        - { name: destinationId, in: query, schema: { $ref: '#/components/schemas/UuidV7' } }
        - { name: videoId, in: query, schema: { $ref: '#/components/schemas/UuidV7' } }
        - { name: scheduled, in: query, schema: { type: boolean } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Trang publication task., content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskListEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /videos/{videoId}/publish-packages:
    post:
      summary: Tạo package và các destination task
      operationId: createPublishPackage
      parameters:
        - { $ref: '#/components/parameters/VideoId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePublishPackage' } } } }
      responses:
        '201': { description: Package đã tạo., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublishPackageEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publish-packages/{publishPackageId}:
    get:
      summary: Đọc package cùng sibling task
      operationId: getPublishPackage
      parameters: [{ name: publishPackageId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }]
      responses:
        '200': { description: Package hiện tại., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublishPackageEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}:
    get:
      summary: Đọc publication task
      operationId: getPublicationTask
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }]
      responses:
        '200': { description: Task hiện tại., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/generate-content:
    post:
      summary: Yêu cầu Content Agent sinh toàn bộ metadata
      operationId: generatePublicationContent
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Task sau khi sinh nội dung., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/fields/{fieldKey}:
    patch:
      summary: Tạo revision thủ công cho metadata field
      operationId: updatePublicationField
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { name: fieldKey, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PublicationIfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePublicationField' } } } }
      responses:
        '200': { description: Task sau cập nhật., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/fields/{fieldKey}/regenerate:
    post:
      summary: Yêu cầu Content Agent sinh lại một field
      operationId: regeneratePublicationField
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { name: fieldKey, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Task sau khi sinh lại., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/fields/{fieldKey}/lock:
    patch:
      summary: Khoá hoặc mở khoá metadata field
      operationId: lockPublicationField
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { name: fieldKey, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PublicationIfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [isLocked], properties: { isLocked: { type: boolean } } } } } }
      responses:
        '200': { description: Task sau cập nhật., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/approve-content:
    post:
      summary: Duyệt metadata theo policy PUBLISH_CONTENT
      operationId: approvePublicationContent
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Task đã qua gate., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/plan:
    patch:
      summary: Cập nhật lịch, deadline và ghi chú
      operationId: planPublicationTask
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { $ref: '#/components/parameters/PublicationIfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanPublicationTask' } } } }
      responses:
        '200': { description: Task sau cập nhật., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/checklist/{itemKey}:
    patch:
      summary: Cập nhật checklist snapshot
      operationId: updatePublicationChecklist
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { name: itemKey, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PublicationIfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status], properties: { status: { $ref: '#/components/schemas/PublicationChecklistStatus' } } } } } }
      responses:
        '200': { description: Task sau cập nhật., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/start-manual-posting:
    post:
      summary: Bắt đầu đăng thủ công
      operationId: startManualPosting
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Task đang được đăng thủ công., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/proofs:
    post:
      summary: Ghi nhận một publication proof mới
      operationId: createPublicationProof
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePublicationProof' } } } }
      responses:
        '201': { description: Proof attempt đã ghi nhận., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/proofs/{proofId}/verify:
    post:
      summary: Xác minh publication proof hiện hành
      operationId: verifyPublicationProof
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { name: proofId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV7' } }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyPublicationProof' } } } }
      responses:
        '200': { description: Task sau xác minh., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/request-revision:
    post:
      summary: Mở revision content mới
      operationId: requestPublicationRevision
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { $ref: '#/components/parameters/PublicationIfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Task cần chỉnh sửa., headers: { ETag: { $ref: '#/components/headers/VersionEtag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationTaskEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /publication-tasks/{publicationTaskId}/assets/{assetRole}/download-grant:
    post:
      summary: Cấp presigned download grant theo role
      operationId: grantPublicationAssetDownload
      parameters: [{ $ref: '#/components/parameters/PublicationTaskId' }, { name: assetRole, in: path, required: true, schema: { type: string, enum: [VIDEO, SUBTITLE, THUMBNAIL] } }]
      responses:
        '200': { description: Download grant ngắn hạn., content: { application/json: { schema: { $ref: '#/components/schemas/DownloadGrantEnvelope' } } } }
        default: { $ref: '#/components/responses/Problem' }

components:
  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    ChannelProfileId:
      name: channelProfileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    SeriesProfileId:
      name: seriesProfileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    VoiceProfileId:
      name: voiceProfileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    SourceAccountId:
      name: sourceAccountId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    DiscoveryRunId:
      name: discoveryRunId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    WatchlistId:
      name: watchlistId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    QueueJobId:
      name: queueJobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    WorkerId:
      name: workerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    WorkerImageId:
      name: imageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    SampleId:
      name: sampleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    ChannelIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong effective ETag gồm version Series và parent Channel.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    ChannelReviewPolicyIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag của policy Channel.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesReviewPolicyIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag gồm version policy Series và policy Channel cha.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    VoiceIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    DiscoveryIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProfileQuery:
      name: query
      in: query
      schema: { type: string, maxLength: 120 }
    ProfileStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ProfileStatus' }
    ProfileReadinessFilter:
      name: readiness
      in: query
      schema: { $ref: '#/components/schemas/ProfileReadiness' }
    ChannelProfileFilter:
      name: channelProfileId
      in: query
      schema: { $ref: '#/components/schemas/UuidV7' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag nhận từ lần đọc Settings gần nhất.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IngestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[!-~]+$' }
    QueueIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    WorkerIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    PublicationTaskId:
      name: publicationTaskId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    PublicationIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  headers:
    VersionEtag:
      description: Strong ETag của aggregate version.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    RequestId:
      description: UUID v7 do API sinh cho request hiện tại.
      schema:
        $ref: '#/components/schemas/RequestId'
    SettingsEtag:
      description: Strong ETag biểu diễn version hiện tại.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ChannelProfileEtag:
      description: Strong ETag của Channel Profile.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesProfileEtag:
      description: Strong ETag của effective Series, gồm version Series và parent.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    ChannelReviewPolicyEtag:
      description: Strong ETag của policy Channel.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesReviewPolicyEtag:
      description: Strong ETag của policy Series và policy Channel cha.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    VoiceProfileEtag:
      description: Strong ETag của Voice Profile và current sample set.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    QueueJobEtag:
      description: Strong ETag của Queue Job.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    WorkerEtag:
      description: Strong ETag của Worker.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    DashboardSeverity: { type: string, enum: [CRITICAL, WARNING] }
    DashboardAttentionCode:
      type: string
      enum: [WORKER_BILLING_SAFE_TO_TERMINATE, WORKER_BILLING_OFFLINE, PUBLICATION_OVERDUE, SOURCE_CREDENTIAL_EXPIRED, QUEUE_JOB_FAILED, PUBLICATION_NEEDS_REVISION, SOURCE_CREDENTIAL_EXPIRING, QUEUE_WAITING_FOR_GPU, SOURCE_ACCOUNT_COOLDOWN]
    DashboardAttentionItem:
      type: object
      additionalProperties: false
      required: [id, code, severity, title, detail, entityType, entityId, occurredAt, dueAt, href]
      properties:
        id: { type: string }
        code: { $ref: '#/components/schemas/DashboardAttentionCode' }
        severity: { $ref: '#/components/schemas/DashboardSeverity' }
        title: { type: string }
        detail: { type: string }
        entityType: { type: string, enum: [PIPELINE_JOB, PUBLICATION_TASK, WORKER, SOURCE_ACCOUNT] }
        entityId: { $ref: '#/components/schemas/UuidV7' }
        occurredAt: { type: string, format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        href: { type: string }
    DashboardActivityItem:
      type: object
      additionalProperties: false
      required: [id, kind, title, detail, entityType, entityId, occurredAt, href]
      properties:
        id: { type: string }
        kind: { type: string, enum: [QUEUE_EVENT, AUDIT_EVENT, PUBLICATION_PROOF_SUBMITTED, PUBLICATION_PROOF_VERIFIED] }
        title: { type: string }
        detail: { type: [string, 'null'] }
        entityType: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
        href: { type: string }
    DashboardVideoCounts:
      type: object
      additionalProperties: false
      required: [INGEST_QUEUED, INGESTING, INGESTED, PROCESSING, AWAITING_REVIEW, READY_TO_PUBLISH, PUBLISHED, FAILED, ARCHIVED]
      properties:
        INGEST_QUEUED: { type: integer, minimum: 0 }
        INGESTING: { type: integer, minimum: 0 }
        INGESTED: { type: integer, minimum: 0 }
        PROCESSING: { type: integer, minimum: 0 }
        AWAITING_REVIEW: { type: integer, minimum: 0 }
        READY_TO_PUBLISH: { type: integer, minimum: 0 }
        PUBLISHED: { type: integer, minimum: 0 }
        FAILED: { type: integer, minimum: 0 }
        ARCHIVED: { type: integer, minimum: 0 }
    Dashboard:
      type: object
      additionalProperties: false
      required: [generatedAt, timezone, videos, queue, publishing, workers, cost, attention, recentActivity]
      properties:
        generatedAt: { type: string, format: date-time }
        timezone: { type: string, const: Asia/Ho_Chi_Minh }
        videos:
          type: object
          additionalProperties: false
          required: [countsByStatus, processing, awaitingReview, readyToPublish, published, failed, totalActive]
          properties:
            countsByStatus: { $ref: '#/components/schemas/DashboardVideoCounts' }
            processing: { type: integer, minimum: 0 }
            awaitingReview: { type: integer, minimum: 0 }
            readyToPublish: { type: integer, minimum: 0 }
            published: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            totalActive: { type: integer, minimum: 0 }
        queue:
          type: object
          additionalProperties: false
          required: [active, running, waitingForGpu, failed]
          properties:
            active: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            waitingForGpu: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        publishing:
          type: object
          additionalProperties: false
          required: [upcoming, overdue, awaitingProof, awaitingVerification, needsRevision]
          properties:
            upcoming: { type: integer, minimum: 0 }
            overdue: { type: integer, minimum: 0 }
            awaitingProof: { type: integer, minimum: 0 }
            awaitingVerification: { type: integer, minimum: 0 }
            needsRevision: { type: integer, minimum: 0 }
        workers:
          type: object
          additionalProperties: false
          required: [online, busy, safeToTerminate, unhealthy, activeLeases]
          properties:
            online: { type: integer, minimum: 0 }
            busy: { type: integer, minimum: 0 }
            safeToTerminate: { type: integer, minimum: 0 }
            unhealthy: { type: integer, minimum: 0 }
            activeLeases: { type: integer, minimum: 0 }
        cost:
          type: object
          additionalProperties: false
          required: [openBillingSessions, estimatedCostCp, estimatedCostVnd, vndCoverage]
          properties:
            openBillingSessions: { type: integer, minimum: 0 }
            estimatedCostCp: { type: string, pattern: '^[0-9]+(?:\.[0-9]{6})$' }
            estimatedCostVnd: { type: [string, 'null'], pattern: '^[0-9]+(?:\.[0-9]{2})$' }
            vndCoverage: { type: string, enum: [COMPLETE, PARTIAL, NONE] }
        attention:
