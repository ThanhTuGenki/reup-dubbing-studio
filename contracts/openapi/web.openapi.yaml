openapi: 3.1.0
info:
  title: Reup Dubbing Studio Control Plane API
  version: 0.1.0
  description: >-
    Contract JIT cho Web Dashboard và Control Plane. Các slice Health, Settings
    và Channel/Series Profile đã có provider integration, generated client và
    consumer test tương ứng.
servers:
  - url: http://localhost:3000/v1
    description: Môi trường phát triển cục bộ
paths:
  /dashboard:
    get:
      summary: Đọc projection vận hành cho Dashboard home
      operationId: getDashboard
      responses:
        '200':
          description: Snapshot Dashboard hiện tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles:
    get:
      summary: Liệt kê Channel Profile
      operationId: listChannelProfiles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProfileQuery'
        - $ref: '#/components/parameters/ProfileStatusFilter'
        - $ref: '#/components/parameters/ProfileReadinessFilter'
      responses:
        '200':
          description: Trang Channel Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileListEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo Channel Profile ở trạng thái draft
      operationId: createChannelProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChannelProfile' }
      responses:
        '201':
          description: Channel Profile đã tạo.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}:
    parameters:
      - $ref: '#/components/parameters/ChannelProfileId'
    get:
      summary: Đọc Channel Profile
      operationId: getChannelProfile
      responses:
        '200':
          description: Channel Profile hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật Channel Profile
      operationId: updateChannelProfile
      parameters:
        - $ref: '#/components/parameters/ChannelIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelProfile' }
      responses:
        '200':
          description: Channel Profile sau cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/review-policy:
    parameters:
      - $ref: '#/components/parameters/ChannelProfileId'
    get:
      summary: Đọc Review Policy của Channel Profile
      operationId: getChannelReviewPolicy
      responses:
        '200':
          description: Policy nền đầy đủ của Channel.
          headers:
            ETag: { $ref: '#/components/headers/ChannelReviewPolicyEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPolicyEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật Review Policy của Channel Profile
      operationId: updateChannelReviewPolicy
      parameters:
        - $ref: '#/components/parameters/ChannelReviewPolicyIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelReviewPolicy' }
      responses:
        '200':
          description: Policy Channel sau cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/ChannelReviewPolicyEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPolicyEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/archive:
    post:
      summary: Archive Channel Profile
      operationId: archiveChannelProfile
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/ChannelIfMatch'
      responses:
        '200':
          description: Channel Profile đã archive.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/restore:
    post:
      summary: Restore Channel Profile về draft
      operationId: restoreChannelProfile
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/ChannelIfMatch'
      responses:
        '200':
          description: Channel Profile đã restore.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/uploads:
    post:
      summary: Xin presigned upload cho asset của Channel Profile
      operationId: requestChannelProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileAssetUploadRequest' }
      responses:
        '201':
          description: Presigned PUT grant mười phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/uploads/{assetId}/commit:
    post:
      summary: Verify và attach asset vào Channel Profile
      operationId: commitChannelProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ChannelIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Asset đã AVAILABLE và trở thành revision hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommittedAssetEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/uploads/{assetId}/grant:
    post:
      summary: Cấp lại presigned URL cho asset Channel còn pending
      operationId: refreshChannelProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Presigned PUT grant mới cho cùng asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/{linkId}/preview:
    get:
      summary: Xin presigned preview URL cho asset Channel hiện tại
      operationId: previewChannelProfileAsset
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Presigned GET grant năm phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/{linkId}:
    delete:
      summary: Gỡ asset hiện tại khỏi Channel Profile
      operationId: detachChannelProfileAsset
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/ChannelIfMatch'
      responses:
        '200':
          description: Link đã được gỡ.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVersionEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles:
    get:
      summary: Liệt kê Series Profile
      operationId: listSeriesProfiles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProfileQuery'
        - $ref: '#/components/parameters/ProfileStatusFilter'
        - $ref: '#/components/parameters/ProfileReadinessFilter'
        - $ref: '#/components/parameters/ChannelProfileFilter'
      responses:
        '200':
          description: Trang Series Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileListEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo Series Profile ở trạng thái draft
      operationId: createSeriesProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSeriesProfile' }
      responses:
        '201':
          description: Series Profile đã tạo.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}:
    parameters:
      - $ref: '#/components/parameters/SeriesProfileId'
    get:
      summary: Đọc Series Profile cùng effective config
      operationId: getSeriesProfile
      responses:
        '200':
          description: Series Profile hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật override hoặc mask của Series Profile
      operationId: updateSeriesProfile
      parameters:
        - $ref: '#/components/parameters/SeriesIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSeriesProfile' }
      responses:
        '200':
          description: Series Profile sau cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/review-policy:
    parameters:
      - $ref: '#/components/parameters/SeriesProfileId'
    get:
      summary: Đọc override và effective Review Policy của Series Profile
      operationId: getSeriesReviewPolicy
      responses:
        '200':
          description: Policy Series cùng nguồn inheritance từng field.
          headers:
            ETag: { $ref: '#/components/headers/SeriesReviewPolicyEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPolicyEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật override Review Policy của Series Profile
      operationId: updateSeriesReviewPolicy
      parameters:
        - $ref: '#/components/parameters/SeriesReviewPolicyIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSeriesReviewPolicy' }
      responses:
        '200':
          description: Policy Series sau cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/SeriesReviewPolicyEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPolicyEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/archive:
    post:
      summary: Archive Series Profile
      operationId: archiveSeriesProfile
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/SeriesIfMatch'
      responses:
        '200':
          description: Series Profile đã archive.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/restore:
    post:
      summary: Restore Series Profile về draft
      operationId: restoreSeriesProfile
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/SeriesIfMatch'
      responses:
        '200':
          description: Series Profile đã restore.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/uploads:
    post:
      summary: Xin presigned upload cho mask reference frame
      operationId: requestSeriesProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileAssetUploadRequest' }
      responses:
        '201':
          description: Presigned PUT grant mười phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/uploads/{assetId}/commit:
    post:
      summary: Verify và attach mask reference frame
      operationId: commitSeriesProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/SeriesIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Asset đã AVAILABLE và trở thành revision hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommittedAssetEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/uploads/{assetId}/grant:
    post:
      summary: Cấp lại presigned URL cho mask reference còn pending
      operationId: refreshSeriesProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Presigned PUT grant mới cho cùng asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/{linkId}/preview:
    get:
      summary: Xin presigned preview URL cho mask reference hiện tại
      operationId: previewSeriesProfileAsset
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Presigned GET grant năm phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/{linkId}:
    delete:
      summary: Gỡ mask reference frame hiện tại
      operationId: detachSeriesProfileAsset
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/SeriesIfMatch'
      responses:
        '200':
          description: Link đã được gỡ.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVersionEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles:
    get:
      summary: Liệt kê Voice Profile
      operationId: listVoiceProfiles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProfileQuery'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VoiceProfileStatus' } }
        - { name: language, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: commercialUseAllowed, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Trang Voice Profile.
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo Voice Profile draft
      operationId: createVoiceProfile
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoiceProfile' } } }
      responses:
        '201':
          description: Voice Profile đã tạo.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}:
    parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }]
    get:
      summary: Đọc Voice Profile
      operationId: getVoiceProfile
      responses:
        '200':
          description: Voice Profile hiện tại.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật Voice Profile
      operationId: updateVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateVoiceProfile' } } }
      responses:
        '200':
          description: Voice Profile sau cập nhật.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/activate:
    post:
      summary: Activate Voice Profile sau readiness gate
      operationId: activateVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Voice đã activate hoặc bị license gate chặn.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/archive:
    post:
      summary: Archive Voice Profile
      operationId: archiveVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Voice đã archive.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/restore:
    post:
      summary: Restore Voice Profile về draft
      operationId: restoreVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Voice đã restore.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/uploads:
    post:
      summary: Xin presigned upload cho reference sample
      operationId: requestVoiceSampleUpload
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoiceSampleUploadRequest' } } }
      responses:
        '201':
          description: Purpose-scoped PUT grant.
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadGrantEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/uploads/{assetId}/grant:
    post:
      summary: Cấp lại upload grant cho pending sample
      operationId: refreshVoiceSampleUpload
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/AssetId' }]
      responses:
        '200':
          description: PUT grant mới.
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadGrantEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/uploads/{assetId}/commit:
    post:
      summary: Verify và commit reference sample
      operationId: commitVoiceSampleUpload
      parameters:
        - $ref: '#/components/parameters/VoiceProfileId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/VoiceIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sample revision đã commit.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CommittedVoiceSampleEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/{sampleId}/preview:
    get:
      summary: Xin presigned preview URL cho sample hiện tại
      operationId: previewVoiceSample
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/SampleId' }]
      responses:
        '200':
          description: GET grant năm phút.
          content: { application/json: { schema: { $ref: '#/components/schemas/PreviewGrantEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/{sampleId}:
    delete:
      summary: Detach current voice sample
      operationId: detachVoiceSample
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/SampleId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Sample đã detach.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfileVersionEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /settings:
    get:
      summary: Đọc cấu hình hệ thống của workspace
      operationId: getSettings
      responses:
        '200':
          description: Cấu hình hiện tại; secret chỉ xuất hiện dưới dạng metadata an toàn.
          headers:
            ETag:
              $ref: '#/components/headers/SettingsEtag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      summary: Cập nhật nguyên tử một hoặc nhiều nhóm cấu hình
      operationId: updateSettings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Cấu hình sau cập nhật.
          headers:
            ETag:
              $ref: '#/components/headers/SettingsEtag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        default:
          $ref: '#/components/responses/Problem'
  /settings/tests/content-agent:
    post:
