openapi: 3.1.0
info:
  title: Reup Dubbing Studio Control Plane API
  version: 0.1.0
  description: >-
    Contract JIT cho Web Dashboard và Control Plane. Các slice Health, Settings
    và Channel/Series Profile đã có provider integration, generated client và
    consumer test tương ứng.
servers:
  - url: http://localhost:3000/v1
    description: Môi trường phát triển cục bộ
paths:
  /channel-profiles:
    get:
      summary: Liệt kê Channel Profile
      operationId: listChannelProfiles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProfileQuery'
        - $ref: '#/components/parameters/ProfileStatusFilter'
        - $ref: '#/components/parameters/ProfileReadinessFilter'
      responses:
        '200':
          description: Trang Channel Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileListEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo Channel Profile ở trạng thái draft
      operationId: createChannelProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChannelProfile' }
      responses:
        '201':
          description: Channel Profile đã tạo.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}:
    parameters:
      - $ref: '#/components/parameters/ChannelProfileId'
    get:
      summary: Đọc Channel Profile
      operationId: getChannelProfile
      responses:
        '200':
          description: Channel Profile hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật Channel Profile
      operationId: updateChannelProfile
      parameters:
        - $ref: '#/components/parameters/ChannelIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelProfile' }
      responses:
        '200':
          description: Channel Profile sau cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/archive:
    post:
      summary: Archive Channel Profile
      operationId: archiveChannelProfile
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/ChannelIfMatch'
      responses:
        '200':
          description: Channel Profile đã archive.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/restore:
    post:
      summary: Restore Channel Profile về draft
      operationId: restoreChannelProfile
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/ChannelIfMatch'
      responses:
        '200':
          description: Channel Profile đã restore.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/uploads:
    post:
      summary: Xin presigned upload cho asset của Channel Profile
      operationId: requestChannelProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileAssetUploadRequest' }
      responses:
        '201':
          description: Presigned PUT grant mười phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/uploads/{assetId}/commit:
    post:
      summary: Verify và attach asset vào Channel Profile
      operationId: commitChannelProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/ChannelIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Asset đã AVAILABLE và trở thành revision hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommittedAssetEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/uploads/{assetId}/grant:
    post:
      summary: Cấp lại presigned URL cho asset Channel còn pending
      operationId: refreshChannelProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Presigned PUT grant mới cho cùng asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/{linkId}/preview:
    get:
      summary: Xin presigned preview URL cho asset Channel hiện tại
      operationId: previewChannelProfileAsset
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Presigned GET grant năm phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /channel-profiles/{channelProfileId}/assets/{linkId}:
    delete:
      summary: Gỡ asset hiện tại khỏi Channel Profile
      operationId: detachChannelProfileAsset
      parameters:
        - $ref: '#/components/parameters/ChannelProfileId'
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/ChannelIfMatch'
      responses:
        '200':
          description: Link đã được gỡ.
          headers:
            ETag: { $ref: '#/components/headers/ChannelProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVersionEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles:
    get:
      summary: Liệt kê Series Profile
      operationId: listSeriesProfiles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProfileQuery'
        - $ref: '#/components/parameters/ProfileStatusFilter'
        - $ref: '#/components/parameters/ProfileReadinessFilter'
        - $ref: '#/components/parameters/ChannelProfileFilter'
      responses:
        '200':
          description: Trang Series Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileListEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo Series Profile ở trạng thái draft
      operationId: createSeriesProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSeriesProfile' }
      responses:
        '201':
          description: Series Profile đã tạo.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}:
    parameters:
      - $ref: '#/components/parameters/SeriesProfileId'
    get:
      summary: Đọc Series Profile cùng effective config
      operationId: getSeriesProfile
      responses:
        '200':
          description: Series Profile hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật override hoặc mask của Series Profile
      operationId: updateSeriesProfile
      parameters:
        - $ref: '#/components/parameters/SeriesIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSeriesProfile' }
      responses:
        '200':
          description: Series Profile sau cập nhật.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/archive:
    post:
      summary: Archive Series Profile
      operationId: archiveSeriesProfile
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/SeriesIfMatch'
      responses:
        '200':
          description: Series Profile đã archive.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/restore:
    post:
      summary: Restore Series Profile về draft
      operationId: restoreSeriesProfile
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/SeriesIfMatch'
      responses:
        '200':
          description: Series Profile đã restore.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesProfileEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/uploads:
    post:
      summary: Xin presigned upload cho mask reference frame
      operationId: requestSeriesProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileAssetUploadRequest' }
      responses:
        '201':
          description: Presigned PUT grant mười phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/uploads/{assetId}/commit:
    post:
      summary: Verify và attach mask reference frame
      operationId: commitSeriesProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/SeriesIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Asset đã AVAILABLE và trở thành revision hiện tại.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommittedAssetEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/uploads/{assetId}/grant:
    post:
      summary: Cấp lại presigned URL cho mask reference còn pending
      operationId: refreshSeriesProfileAssetUpload
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Presigned PUT grant mới cho cùng asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/{linkId}/preview:
    get:
      summary: Xin presigned preview URL cho mask reference hiện tại
      operationId: previewSeriesProfileAsset
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Presigned GET grant năm phút.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewGrantEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /series-profiles/{seriesProfileId}/assets/{linkId}:
    delete:
      summary: Gỡ mask reference frame hiện tại
      operationId: detachSeriesProfileAsset
      parameters:
        - $ref: '#/components/parameters/SeriesProfileId'
        - $ref: '#/components/parameters/LinkId'
        - $ref: '#/components/parameters/SeriesIfMatch'
      responses:
        '200':
          description: Link đã được gỡ.
          headers:
            ETag: { $ref: '#/components/headers/SeriesProfileEtag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVersionEnvelope' }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles:
    get:
      summary: Liệt kê Voice Profile
      operationId: listVoiceProfiles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProfileQuery'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VoiceProfileStatus' } }
        - { name: language, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: commercialUseAllowed, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Trang Voice Profile.
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo Voice Profile draft
      operationId: createVoiceProfile
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoiceProfile' } } }
      responses:
        '201':
          description: Voice Profile đã tạo.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}:
    parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }]
    get:
      summary: Đọc Voice Profile
      operationId: getVoiceProfile
      responses:
        '200':
          description: Voice Profile hiện tại.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      summary: Cập nhật Voice Profile
      operationId: updateVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceIfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateVoiceProfile' } } }
      responses:
        '200':
          description: Voice Profile sau cập nhật.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/activate:
    post:
      summary: Activate Voice Profile sau readiness gate
      operationId: activateVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Voice đã activate hoặc bị license gate chặn.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/archive:
    post:
      summary: Archive Voice Profile
      operationId: archiveVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Voice đã archive.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/restore:
    post:
      summary: Restore Voice Profile về draft
      operationId: restoreVoiceProfile
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Voice đã restore.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceProfileEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/uploads:
    post:
      summary: Xin presigned upload cho reference sample
      operationId: requestVoiceSampleUpload
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoiceSampleUploadRequest' } } }
      responses:
        '201':
          description: Purpose-scoped PUT grant.
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadGrantEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/uploads/{assetId}/grant:
    post:
      summary: Cấp lại upload grant cho pending sample
      operationId: refreshVoiceSampleUpload
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/AssetId' }]
      responses:
        '200':
          description: PUT grant mới.
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadGrantEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/uploads/{assetId}/commit:
    post:
      summary: Verify và commit reference sample
      operationId: commitVoiceSampleUpload
      parameters:
        - $ref: '#/components/parameters/VoiceProfileId'
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/VoiceIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sample revision đã commit.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CommittedVoiceSampleEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/{sampleId}/preview:
    get:
      summary: Xin presigned preview URL cho sample hiện tại
      operationId: previewVoiceSample
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/SampleId' }]
      responses:
        '200':
          description: GET grant năm phút.
          content: { application/json: { schema: { $ref: '#/components/schemas/PreviewGrantEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /voice-profiles/{voiceProfileId}/samples/{sampleId}:
    delete:
      summary: Detach current voice sample
      operationId: detachVoiceSample
      parameters: [{ $ref: '#/components/parameters/VoiceProfileId' }, { $ref: '#/components/parameters/SampleId' }, { $ref: '#/components/parameters/VoiceIfMatch' }]
      responses:
        '200':
          description: Sample đã detach.
          headers: { ETag: { $ref: '#/components/headers/VoiceProfileEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfileVersionEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /settings:
    get:
      summary: Đọc cấu hình hệ thống của workspace
      operationId: getSettings
      responses:
        '200':
          description: Cấu hình hiện tại; secret chỉ xuất hiện dưới dạng metadata an toàn.
          headers:
            ETag:
              $ref: '#/components/headers/SettingsEtag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      summary: Cập nhật nguyên tử một hoặc nhiều nhóm cấu hình
      operationId: updateSettings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Cấu hình sau cập nhật.
          headers:
            ETag:
              $ref: '#/components/headers/SettingsEtag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        default:
          $ref: '#/components/responses/Problem'
  /settings/tests/content-agent:
    post:
      summary: Kiểm tra credential và model Content Agent
      operationId: testContentAgentConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentAgentTestRequest'
      responses:
        '200':
          description: Kết nối thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestEnvelope'
        default:
          $ref: '#/components/responses/Problem'
  /settings/tests/storage:
    post:
      summary: Kiểm tra quyền write/read/delete trên Cloudflare R2
      operationId: testStorageConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageTestRequest'
      responses:
        '200':
          description: Kết nối và probe object thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestEnvelope'
        default:
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      summary: Kiểm tra liveness của Control Plane
      operationId: getLiveness
      responses:
        '200':
          description: Tiến trình đang phục vụ HTTP request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  status: ok
                meta:
                  requestId: 0191f3d2-7f5b-7abc-8b2e-123456789abc
        default:
          $ref: '#/components/responses/Problem'
  /health/ready:
    get:
      summary: Kiểm tra readiness của Control Plane
      operationId: getReadiness
      responses:
        '200':
          description: Bootstrap và cấu hình nền tảng hợp lệ để nhận request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  status: ok
                meta:
                  requestId: 0191f3d2-7f5b-7abc-8b2e-123456789abd
        default:
          $ref: '#/components/responses/Problem'
  /source-accounts:
    get:
      summary: Liệt kê tài khoản nguồn
      operationId: listSourceAccounts
      parameters:
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/SourcePlatform' }
      responses:
        '200':
          description: Danh sách tài khoản nguồn và health metadata.
          content: { application/json: { schema: { $ref: '#/components/schemas/SourceAccountListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo tài khoản nguồn
      operationId: createSourceAccount
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSourceAccount' } } }
      responses:
        '201':
          description: Tài khoản nguồn đã tạo.
          content: { application/json: { schema: { $ref: '#/components/schemas/SourceAccountEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /source-accounts/{sourceAccountId}/credentials:
    post:
      summary: Rotate Netscape cookie đã mã hóa
      operationId: importSourceCredential
      parameters: [{ $ref: '#/components/parameters/SourceAccountId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImportSourceCredential' } } }
      responses:
        '200':
          description: Credential đã rotate; response không chứa secret.
          content: { application/json: { schema: { $ref: '#/components/schemas/SourceAccountEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /source-accounts/{sourceAccountId}/validate:
    post:
      summary: Kiểm tra credential bằng browser adapter
      operationId: validateSourceAccount
      parameters: [{ $ref: '#/components/parameters/SourceAccountId' }]
      responses:
        '200':
          description: Health metadata mới nhất.
          content: { application/json: { schema: { $ref: '#/components/schemas/SourceAccountEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /source-accounts/{sourceAccountId}/credentials/current:
    delete:
      summary: Revoke credential hiện tại
      operationId: revokeSourceCredential
      parameters: [{ $ref: '#/components/parameters/SourceAccountId' }]
      responses:
        '200':
          description: Credential đã revoke.
          content: { application/json: { schema: { $ref: '#/components/schemas/SourceAccountEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /discovery/categories:
    get:
      summary: Liệt kê category động của provider
      operationId: listDiscoveryCategories
      parameters:
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SourcePlatform' }
      responses:
        '200':
          description: Category đang active.
          content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryCategoryListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /discovery/runs:
    post:
      summary: Queue một lần quét Discovery
      operationId: createDiscoveryRun
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDiscoveryRun' } } }
      responses:
        '202':
          description: Run QUEUED; provider chạy ngoài request.
          content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryRunEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /discovery/runs/{discoveryRunId}:
    get:
      summary: Đọc trạng thái Discovery run
      operationId: getDiscoveryRun
      parameters: [{ $ref: '#/components/parameters/DiscoveryRunId' }]
      responses:
        '200':
          description: Run không lộ provider cursor hoặc raw payload.
          content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryRunEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /discovery/runs/{discoveryRunId}/cancel:
    post:
      summary: Hủy run theo cách idempotent
      operationId: cancelDiscoveryRun
      parameters: [{ $ref: '#/components/parameters/DiscoveryRunId' }]
      responses:
        '200':
          description: Run sau yêu cầu cancel.
          content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryRunEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /discovery/items:
    get:
      summary: Liệt kê source content đã persist
      operationId: listDiscoveryItems
      parameters:
        - { name: runId, in: query, schema: { $ref: '#/components/schemas/UuidV7' } }
        - { name: categoryId, in: query, schema: { $ref: '#/components/schemas/UuidV7' } }
        - { name: creatorId, in: query, schema: { $ref: '#/components/schemas/UuidV7' } }
        - { name: contentType, in: query, schema: { $ref: '#/components/schemas/SourceContentType' } }
        - { name: availability, in: query, schema: { $ref: '#/components/schemas/Availability' } }
        - { name: ingestEligible, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Cursor nội bộ; chỉ cover URL đã sanitize.
          content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryItemListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /watchlists:
    get:
      summary: Liệt kê watchlist
      operationId: listWatchlists
      responses:
        '200':
          description: Danh sách watchlist.
          content: { application/json: { schema: { $ref: '#/components/schemas/WatchlistListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      summary: Tạo creator watchlist
      operationId: createWatchlist
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWatchlist' } } }
      responses:
        '201':
          description: Watchlist đã tạo.
          content: { application/json: { schema: { $ref: '#/components/schemas/WatchlistEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /watchlists/{watchlistId}:
    patch:
      summary: Cập nhật watchlist
      operationId: updateWatchlist
      parameters:
        - { $ref: '#/components/parameters/WatchlistId' }
        - { $ref: '#/components/parameters/DiscoveryIfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWatchlist' } } }
      responses:
        '200':
          description: Watchlist sau cập nhật.
          content: { application/json: { schema: { $ref: '#/components/schemas/WatchlistEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      summary: Xóa watchlist khi không có active run
      operationId: deleteWatchlist
      parameters:
        - { $ref: '#/components/parameters/WatchlistId' }
        - { $ref: '#/components/parameters/DiscoveryIfMatch' }
      responses:
        '200':
          description: Watchlist đã xóa.
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletedResourceEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /watchlists/{watchlistId}/run:
    post:
      summary: Queue run có audit trail cho watchlist
      operationId: runWatchlist
      parameters:
        - { $ref: '#/components/parameters/WatchlistId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Discovery run QUEUED.
          content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryRunEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /ingest/preflight:
    post:
      summary: Kiểm tra selection trước khi xác nhận tạo Ingest Job
      operationId: preflightIngestJobs
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IngestSelection' } } }
      responses:
        '200':
          description: Disposition hiện tại của từng source content.
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestPreflightEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /ingest/jobs:
    post:
      summary: Tạo idempotent Ingest Job và DOWNLOAD task
      operationId: createIngestJobs
      parameters: [{ $ref: '#/components/parameters/IngestIdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IngestSelection' } } }
      responses:
        '200':
          description: Tất cả item dùng lại resource hiện hữu.
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestCreateEnvelope' } } }
        '201':
          description: Ít nhất một Ingest Job được tạo.
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestCreateEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /queue/jobs:
    get:
      summary: Liệt kê Job trong Queue
      operationId: listQueueJobs
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: resourceClass, in: query, schema: { type: string } }
        - { name: channelProfileId, in: query, schema: { $ref: '#/components/schemas/UuidV7' } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Trang Queue theo cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueJobListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /queue/jobs/{queueJobId}:
    get:
      summary: Đọc chi tiết Job, Task và timeline an toàn
      operationId: getQueueJob
      parameters: [{ $ref: '#/components/parameters/QueueJobId' }]
      responses:
        '200':
          description: Queue Job hiện tại.
          headers: { ETag: { $ref: '#/components/headers/QueueJobEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueJobDetailEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /queue/jobs/{queueJobId}/attempts:
    get:
      summary: Liệt kê attempt an toàn của Job
      operationId: listQueueJobAttempts
      parameters:
        - { $ref: '#/components/parameters/QueueJobId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Trang attempt.
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueAttemptListEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /queue/jobs/{queueJobId}/cancel:
    post:
      summary: Hủy Job idempotent
      operationId: cancelQueueJob
      parameters:
        - { $ref: '#/components/parameters/QueueJobId' }
        - { $ref: '#/components/parameters/QueueIfMatch' }
        - { $ref: '#/components/parameters/IngestIdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QueueAction' } } }
      responses:
        '200':
          description: Job sau cancel.
          headers: { ETag: { $ref: '#/components/headers/QueueJobEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueJobDetailEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
  /queue/jobs/{queueJobId}/retry:
    post:
      summary: Retry một Task lỗi của Job
      operationId: retryQueueJob
      parameters:
        - { $ref: '#/components/parameters/QueueJobId' }
        - { $ref: '#/components/parameters/QueueIfMatch' }
        - { $ref: '#/components/parameters/IngestIdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QueueAction' } } }
      responses:
        '200':
          description: Job đã queue lại Task lỗi.
          headers: { ETag: { $ref: '#/components/headers/QueueJobEtag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueJobDetailEnvelope' } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ChannelProfileId:
      name: channelProfileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    SeriesProfileId:
      name: seriesProfileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    VoiceProfileId:
      name: voiceProfileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    SourceAccountId:
      name: sourceAccountId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    DiscoveryRunId:
      name: discoveryRunId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    WatchlistId:
      name: watchlistId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    QueueJobId:
      name: queueJobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    SampleId:
      name: sampleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    LinkId:
      name: linkId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UuidV7' }
    ChannelIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong effective ETag gồm version Series và parent Channel.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    VoiceIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    DiscoveryIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProfileQuery:
      name: query
      in: query
      schema: { type: string, maxLength: 120 }
    ProfileStatusFilter:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ProfileStatus' }
    ProfileReadinessFilter:
      name: readiness
      in: query
      schema: { $ref: '#/components/schemas/ProfileReadiness' }
    ChannelProfileFilter:
      name: channelProfileId
      in: query
      schema: { $ref: '#/components/schemas/UuidV7' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag nhận từ lần đọc Settings gần nhất.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IngestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[!-~]+$' }
    QueueIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  headers:
    RequestId:
      description: UUID v7 do API sinh cho request hiện tại.
      schema:
        $ref: '#/components/schemas/RequestId'
    SettingsEtag:
      description: Strong ETag biểu diễn version hiện tại.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ChannelProfileEtag:
      description: Strong ETag của Channel Profile.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    SeriesProfileEtag:
      description: Strong ETag của effective Series, gồm version Series và parent.
      schema: { type: string, pattern: '^"[1-9][0-9]*:[1-9][0-9]*"$' }
    VoiceProfileEtag:
      description: Strong ETag của Voice Profile và current sample set.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    QueueJobEtag:
      description: Strong ETag của Queue Job.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    SourcePlatform: { type: string, enum: [DOUYIN, BILIBILI, YOUTUBE] }
    CredentialStatus: { type: string, enum: [ACTIVE, EXPIRED, CAPTCHA_REQUIRED, INVALID, REVOKED] }
    DiscoveryMode: { type: string, enum: [JINGXUAN, CATEGORY, COURSE, CREATOR, MIX, SEARCH_VIDEO, SEARCH_USER, VIDEO_URL, WATCHLIST] }
    DiscoveryRunStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED] }
    SourceContentType: { type: string, enum: [VIDEO, LONG_VIDEO, NOTE, SLIDES, ARTICLE, LIVE, UNKNOWN] }
    Availability: { type: string, enum: [AVAILABLE, PRIVATE, REMOVED, REGION_BLOCKED, UNKNOWN] }
    WatchlistStatus: { type: string, enum: [ACTIVE, PAUSED, CREDENTIAL_REQUIRED, FAILED] }
    CreateSourceAccount:
      type: object
      additionalProperties: false
      required: [platform, displayName]
      properties:
        platform: { $ref: '#/components/schemas/SourcePlatform' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
    ImportSourceCredential:
      type: object
      additionalProperties: false
      required: [netscapeCookie]
      properties:
        netscapeCookie: { type: string, minLength: 1, maxLength: 262144, writeOnly: true }
    SourceCredentialHealth:
      type: object
      additionalProperties: false
      required: [kind, importedAt, expiresAt]
      properties:
        kind: { type: string, const: NETSCAPE_COOKIE }
        importedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    SourceAccount:
      type: object
      additionalProperties: false
      required: [id, platform, displayName, status, credential, lastValidatedAt, lastSuccessAt, consecutiveFailures, cooldownUntil, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        platform: { $ref: '#/components/schemas/SourcePlatform' }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        credential: { oneOf: [{ $ref: '#/components/schemas/SourceCredentialHealth' }, { type: 'null' }] }
        lastValidatedAt: { type: [string, 'null'], format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        consecutiveFailures: { type: integer, minimum: 0 }
        cooldownUntil: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DiscoveryCategory:
      type: object
      additionalProperties: false
      required: [id, platform, externalKey, slug, label, kind, parentId]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        platform: { $ref: '#/components/schemas/SourcePlatform' }
        externalKey: { type: string }
        slug: { type: [string, 'null'] }
        label: { type: string }
        kind: { type: string }
        parentId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
    CreateDiscoveryRun:
      type: object
      additionalProperties: false
      required: [sourceAccountId, mode]
      properties:
        sourceAccountId: { $ref: '#/components/schemas/UuidV7' }
        mode: { $ref: '#/components/schemas/DiscoveryMode' }
        input: { type: string, maxLength: 2000 }
        query: { type: string, maxLength: 200 }
        categoryId: { $ref: '#/components/schemas/UuidV7' }
        requestedLimit: { type: integer, enum: [20, 50, 100] }
    DiscoveryRun:
      type: object
      additionalProperties: false
      required: [id, sourceAccountId, mode, status, input, query, categoryId, watchlistId, requestedLimit, pageCount, itemCount, skippedCounts, errorCode, errorDetail, version, startedAt, finishedAt, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        sourceAccountId: { $ref: '#/components/schemas/UuidV7' }
        mode: { $ref: '#/components/schemas/DiscoveryMode' }
        status: { $ref: '#/components/schemas/DiscoveryRunStatus' }
        input: { type: [string, 'null'] }
        query: { type: [string, 'null'] }
        categoryId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        watchlistId: { oneOf: [{ $ref: '#/components/schemas/UuidV7' }, { type: 'null' }] }
        requestedLimit: { type: [integer, 'null'] }
        pageCount: { type: integer, minimum: 0 }
        itemCount: { type: integer, minimum: 0 }
        skippedCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        errorCode: { type: [string, 'null'] }
        errorDetail: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DiscoveryCreatorSummary:
      type: object
      additionalProperties: false
      required: [id, externalId, nickname, profileUrl]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        externalId: { type: string }
        nickname: { type: [string, 'null'] }
        profileUrl: { type: [string, 'null'], format: uri }
    DiscoveryMetrics:
      type: object
      additionalProperties: false
      required: [capturedAt, playCount, diggCount, commentCount, collectCount, shareCount]
      properties:
        capturedAt: { type: string, format: date-time }
        playCount: { type: [string, 'null'], pattern: '^[0-9]+$' }
        diggCount: { type: [string, 'null'], pattern: '^[0-9]+$' }
        commentCount: { type: [string, 'null'], pattern: '^[0-9]+$' }
        collectCount: { type: [string, 'null'], pattern: '^[0-9]+$' }
        shareCount: { type: [string, 'null'], pattern: '^[0-9]+$' }
    SourceContentSummary:
      type: object
      additionalProperties: false
      required: [id, platform, externalId, contentType, title, description, canonicalUrl, publishedAt, durationMs, width, height, availability, ingestEligible, firstSeenAt, lastSeenAt, creator, categories, cover, metrics]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        platform: { $ref: '#/components/schemas/SourcePlatform' }
        externalId: { type: string }
        contentType: { $ref: '#/components/schemas/SourceContentType' }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        canonicalUrl: { type: [string, 'null'], format: uri }
        publishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        width: { type: [integer, 'null'], minimum: 0 }
        height: { type: [integer, 'null'], minimum: 0 }
        availability: { $ref: '#/components/schemas/Availability' }
        ingestEligible: { type: boolean }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        creator: { oneOf: [{ $ref: '#/components/schemas/DiscoveryCreatorSummary' }, { type: 'null' }] }
        categories: { type: array, items: { $ref: '#/components/schemas/DiscoveryCategory' } }
        cover:
          oneOf:
            - type: object
              additionalProperties: false
              required: [url, requiresRefresh]
              properties: { url: { type: string, format: uri }, requiresRefresh: { type: boolean } }
            - type: 'null'
        metrics: { oneOf: [{ $ref: '#/components/schemas/DiscoveryMetrics' }, { type: 'null' }] }
    DiscoveryItem:
      type: object
      additionalProperties: false
      required: [id, runId, rank, discoveredAt, sourceContent]
      properties:
        id: { $ref: '#/components/schemas/UuidV7' }
        runId: { $ref: '#/components/schemas/UuidV7' }
        rank: { type: integer, minimum: 1 }
