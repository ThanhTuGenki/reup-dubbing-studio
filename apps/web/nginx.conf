# Serves the SPA and proxies Control Plane routes to the API on the same origin,
# so the browser (/v1) and GPU Workers (/worker/v1) share one HTTPS entrypoint.
upstream control_plane_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Media goes straight to R2 through signed URLs; only JSON passes through here.
    client_max_body_size 10m;

    location ~ ^/(v1|worker/v1)/ {
        proxy_pass http://control_plane_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE (/v1/queue/events, /v1/worker-events) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
